name: Publish apps

# On every push to main that changes app code (not only docs):
#   1. version: work out the version. If the push did not set `version` in
#      config.yaml by hand, use the next patch number. Nothing is committed yet.
#   2. build + publish the image and multi-arch manifest for that version.
#   3. announce: only after the image is published, commit the version bump
#      to main (skipped when the version was set by hand). The Home Assistant
#      app store reads config.yaml from main, so it never offers a version
#      whose image does not exist.
#   4. release: create the GitHub release for that version.
# Existing tags are skipped, never overwritten.

on:
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-main
  cancel-in-progress: false

env:
  APP: bus-line21
  APP_DIR: apps/bus-line21
  CFG: apps/bus-line21/config.yaml
  ARCHITECTURES: '["amd64", "aarch64"]'

jobs:
  version:
    name: Work out version
    runs-on: ubuntu-latest
    outputs:
      publish: ${{ steps.version.outputs.publish }}
      version: ${{ steps.version.outputs.version }}
      bump: ${{ steps.version.outputs.bump }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compute next version
        id: version
        env:
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          read_version() { sed -n 's/^version: *"\(.*\)"/\1/p' "$1"; }
          current=$(read_version "$CFG")
          test -n "$current" || { echo "no version in $CFG"; exit 1; }

          # Only app code counts; a docs-only push publishes nothing.
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            code_changes=$(git diff --name-only "$BEFORE" "$GITHUB_SHA" -- "$APP_DIR" | grep -v '\.md$' || true)
          else
            code_changes="new"
          fi
          if [ -z "$code_changes" ]; then
            echo "Only docs changed under $APP_DIR; nothing to publish."
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "bump=false" >> "$GITHUB_OUTPUT"
            echo "version=$current" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          previous=""
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            previous=$(git show "$BEFORE:$CFG" 2>/dev/null | sed -n 's/^version: *"\(.*\)"/\1/p' || true)
          fi

          if [ -n "$previous" ] && [ "$current" != "$previous" ]; then
            echo "Version set by hand: $previous -> $current. Keeping it."
            new="$current"
            bump=false
          else
            IFS=. read -r major minor patch <<< "$current"
            new="$major.$minor.$((patch + 1))"
            bump=true
            echo "Next version: $current -> $new (committed after the image is published)."
          fi

          echo "publish=true" >> "$GITHUB_OUTPUT"
          echo "bump=$bump" >> "$GITHUB_OUTPUT"
          echo "version=$new" >> "$GITHUB_OUTPUT"

  init:
    name: Prepare build matrix
    needs: version
    if: needs.version.outputs.publish == 'true'
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.09.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.APP }}

  build:
    name: Build ${{ matrix.arch }}
    needs: [version, init]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write   # Cosign signing
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.init.outputs.matrix) }}
    steps:
      - name: Check out pushed commit
        uses: actions/checkout@v4

      - name: Build and push image
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          context: ${{ env.APP_DIR }}
          image: ${{ matrix.image }}
          image-tags: ${{ needs.version.outputs.version }}
          version: ${{ needs.version.outputs.version }}
          skip-existing: ${{ needs.version.outputs.version }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          push: "true"

  manifest:
    name: Publish multi-arch manifest
    needs: [version, init, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # Cosign signing
      packages: write
    steps:
      - name: Publish manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.09.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.APP }}
          image-tags: ${{ needs.version.outputs.version }}
          skip-existing: ${{ needs.version.outputs.version }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}

  announce:
    name: Announce version on main
    # Runs only after the manifest is published, so the store never sees a version without an image.
    needs: [version, manifest]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      sha: ${{ steps.commit.outputs.sha }}
    steps:
      - name: Check out main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Commit version bump
        id: commit
        env:
          NEW: ${{ needs.version.outputs.version }}
          BUMP: ${{ needs.version.outputs.bump }}
        run: |
          set -euo pipefail
          if [ "$BUMP" = "true" ]; then
            sed -i "s/^version: .*/version: \"$NEW\"/" "$CFG"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$CFG"
            git commit -m "Bump $APP to $NEW [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          else
            # Version was set by hand in the pushed commit; release that commit.
            echo "sha=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          fi

  release:
    name: Create GitHub release
    needs: [version, announce]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      VERSION: ${{ needs.version.outputs.version }}
      SHA: ${{ needs.announce.outputs.sha }}
    steps:
      - name: Check out announced commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.announce.outputs.sha }}

      - name: Create release with notes
        run: |
          set -euo pipefail
          tag="v$VERSION"
          if gh release view "$tag" >/dev/null 2>&1; then
            echo "Release $tag already exists, leaving it alone."
            exit 0
          fi
          # Use the matching CHANGELOG.md section as notes when there is one;
          # otherwise let GitHub generate notes from merged PRs and commits.
          awk -v v="$VERSION" 'index($0, "## " v) == 1 && length($0) == length("## " v) {on=1; next} /^## / {on=0} on' \
            "$APP_DIR/CHANGELOG.md" > notes.md
          if [ -s notes.md ]; then
            gh release create "$tag" --target "$SHA" --title "$APP $VERSION" --notes-file notes.md
          else
            gh release create "$tag" --target "$SHA" --title "$APP $VERSION" --generate-notes
          fi
        env:
          APP: bus-line21
          APP_DIR: apps/bus-line21
