name: Publish apps

# On every push to main that touches an app:
#   1. bump: if the push did not set `version` in config.yaml by hand, bump the
#      patch number and commit it back to main. A hand-edited version (for
#      major/minor changes) is used as-is.
#   2. build + publish the image for that version to GHCR.
# Existing tags are skipped, never overwritten.

on:
  push:
    branches:
      - main
    paths:
      - "apps/**"
      - ".github/workflows/publish.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-main
  cancel-in-progress: false

env:
  APP: bus-line21
  APP_DIR: apps/bus-line21
  ARCHITECTURES: '["amd64", "aarch64"]'

jobs:
  bump:
    name: Bump patch version
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      version: ${{ steps.bump.outputs.version }}
      sha: ${{ steps.bump.outputs.sha }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Bump version unless set by hand
        id: bump
        env:
          CFG: apps/bus-line21/config.yaml
          BEFORE: ${{ github.event.before }}
        run: |
          set -euo pipefail
          read_version() { sed -n 's/^version: *"\(.*\)"/\1/p' "$1"; }
          current=$(read_version "$CFG")
          test -n "$current" || { echo "no version in $CFG"; exit 1; }

          previous=""
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            previous=$(git show "$BEFORE:$CFG" 2>/dev/null | sed -n 's/^version: *"\(.*\)"/\1/p' || true)
          fi

          new="$current"
          if [ -n "$previous" ] && [ "$current" != "$previous" ]; then
            echo "Version set by hand: $previous -> $current. Keeping it."
          else
            IFS=. read -r major minor patch <<< "$current"
            new="$major.$minor.$((patch + 1))"
            sed -i "s/^version: .*/version: \"$new\"/" "$CFG"
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add "$CFG"
            git commit -m "Bump $APP to $new [skip ci]"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "Bumped $current -> $new"
          fi

          echo "version=$new" >> "$GITHUB_OUTPUT"
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  init:
    name: Prepare build matrix
    needs: bump
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - name: Build matrix
        id: matrix
        uses: home-assistant/builder/actions/prepare-multi-arch-matrix@2026.09.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.APP }}

  build:
    name: Build ${{ matrix.arch }}
    needs: [bump, init]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
      id-token: write   # Cosign signing
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.init.outputs.matrix) }}
    steps:
      - name: Check out bumped commit
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.bump.outputs.sha }}

      - name: Build and push image
        uses: home-assistant/builder/actions/build-image@2026.09.0
        with:
          arch: ${{ matrix.arch }}
          context: ${{ env.APP_DIR }}
          image: ${{ matrix.image }}
          image-tags: ${{ needs.bump.outputs.version }}
          version: ${{ needs.bump.outputs.version }}
          skip-existing: ${{ needs.bump.outputs.version }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
          push: "true"

  manifest:
    name: Publish multi-arch manifest
    needs: [bump, init, build]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write   # Cosign signing
      packages: write
    steps:
      - name: Publish manifest
        uses: home-assistant/builder/actions/publish-multi-arch-manifest@2026.09.0
        with:
          architectures: ${{ env.ARCHITECTURES }}
          image-name: ${{ env.APP }}
          image-tags: ${{ needs.bump.outputs.version }}
          skip-existing: ${{ needs.bump.outputs.version }}
          container-registry-password: ${{ secrets.GITHUB_TOKEN }}
